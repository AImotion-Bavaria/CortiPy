[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortipy"
description = "Python EEG acquisition and analysis toolkit"
readme = "README.md"
requires-python = ">=3.9,<3.13"
authors = [{ name = "CortiPy developers" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "numpy==1.26.4",
    "scipy>=1.13.1",
    "pylsl>=1.17.6",
    "matplotlib==3.9.2",
    "mne>=1.6.1",
    "pandas>=2.1",
    "pyserial==3.5",
    "tomli>=2.0.1; python_version < \"3.11\"",
]
dynamic = ["version"]

[project.optional-dependencies]
ui = [
    "streamlit>=1.38,<1.50",
    "plotly>=5.24,<6",
    "streamlit-plotly-events==0.0.6",
]
bids = [
    "pyedflib>=0.1.36",
    "pyarrow>=10",
    "fastparquet>=2024.2.0",
    "h5py>=3.9",
    "zarr>=2.15",
    "pybv>=0.7.6",
    "eeglabio>=0.0.5",
]
sbids = [
    "jsonschema>=4.22.0",
    "pyld>=2.0.4",
]

dev = [
    "ruff",
]

[project.urls]
Homepage = "https://github.com/CortiPy/CortiPy"

[tool.setuptools]
packages = { find = { include = ["cortipy*"], exclude = ["cortipy.__pycache__"] } }
include-package-data = true

[tool.setuptools.package-data]
"cortipy.devices" = ["actichamp/*"]

[tool.setuptools.dynamic]
version = { attr = "cortipy.__version__" }


[tool.ruff]
line-length = 100
target-version = "py312"
 
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortipy"
description = "Python EEG acquisition and analysis toolkit"
readme = "README.md"
requires-python = ">=3.9,<3.13"
authors = [{ name = "CortiPy developers" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "numpy==1.26.4",
    "scipy>=1.13.1",
    "pylsl>=1.17.6",
    "matplotlib==3.9.2",
    "mne>=1.6.1",
    "pandas>=2.1",
    "pyserial==3.5",
    "tomli>=2.0.1; python_version < \"3.11\"",
]
dynamic = ["version"]

[project.optional-dependencies]
ui = [
    "streamlit>=1.38,<1.50",
    "plotly>=5.24,<6",
    "streamlit-plotly-events==0.0.6",
]
bids = [
    "pyedflib>=0.1.36",
    "pyarrow>=10",
    "fastparquet>=2024.2.0",
    "h5py>=3.9",
    "zarr>=2.15",
    "pybv>=0.7.6",
    "eeglabio>=0.0.5",
]
sbids = [
    "jsonschema>=4.22.0",
    "pyld>=2.0.4",
]
stim = [
    "pygame>=2.5",
]

dev = [
    "ruff",
]

[project.urls]
Homepage = "https://github.com/CortiPy/CortiPy"

[tool.setuptools]
packages = { find = { include = ["cortipy*"], exclude = ["cortipy.__pycache__"] } }
include-package-data = true

[tool.setuptools.package-data]
"cortipy.devices" = ["actichamp/*"]

[tool.setuptools.dynamic]
version = { attr = "cortipy.__version__" }


[tool.ruff]
line-length = 100
# Match requires-python (>=3.9). Targeting py312 made Ruff suggest syntax that
# cannot run on 3.9, e.g. zip(..., strict=True).
target-version = "py39"
# Separate Git repository with its own tooling; not ours to lint or fix from here.
exclude = ["CortiPy_VEP_Ear_Study"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Backlog inherited from before Ruff ran in CI (~1800 findings, almost all
# cosmetic or annotation-modernisation). Real defects (F, and B apart from the
# cases below) stay enforced so new code is held to them; these are silenced
# until a dedicated cleanup pass, which should remove them one code at a time.
ignore = [
    "B027",   # empty method in an ABC without @abstractmethod: ModuleBase's
              # documented optional hooks (on_connected, ...) are meant to be
              # no-ops unless a subclass overrides them
    "E501",   # line-too-long (726)
    "I001",   # unsorted-imports; autofix would reorder the deliberate late
              # imports in core/context.py and core/pipeline.py and reintroduce
              # the circular-import crash they exist to avoid
    "UP006",  # non-pep585-annotation (587)
    "UP007",  # non-pep604-annotation-union
    "UP015",  # redundant-open-modes
    "UP035",  # deprecated-import (97)
    "UP037",  # quoted-annotation
    "UP045",  # non-pep604-annotation-optional (322)
]
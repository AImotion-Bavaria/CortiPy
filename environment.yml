name: cortipy
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - numpy==1.26.4
  - scipy>=1.13.1
  - matplotlib==3.9.2
  - mne>=1.6.1
  - pandas>=2.1
  - pyserial==3.5
  - pylsl>=1.17.6
  - tomli>=2.0.1
  - pyedflib>=0.1.36        # BIDS EDF/BDF export
  - pyarrow>=10             # Parquet BIDS files
  - h5py>=3.9               # HDF5 BIDS files
  - zarr>=2.15              # Zarr BIDS files
  - streamlit>=1.26  # optional UI
  - pip
  - pip:
      - .

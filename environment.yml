name: cortipy
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - numpy==1.26.4
  - scipy>=1.13.1
  - matplotlib==3.9.2
  - mne>=1.6.1
  - pandas>=2.1
  - pyserial==3.5
  - pylsl>=1.17.6
  - tomli>=2.0.1
  - jsonschema>=4.22.0       # SBIDS validation
  - pyld>=2.0.4              # SBIDS JSON-LD support
  - pyedflib>=0.1.36        # BIDS EDF/BDF export
  - pyarrow>=10             # Parquet BIDS files
  - fastparquet>=2024.2.0   # Parquet alternative
  - h5py>=3.9               # HDF5 BIDS files
  - zarr>=2.15              # Zarr BIDS files
  - pybv>=0.7.6             # BrainVision export
  - eeglabio>=0.0.5         # EEGLAB export
  - streamlit>=1.26         # optional UI
  - plotly>=5.24            # optional UI
  - pip
  - pip:
      - ".[ui,bids,sbids]"
